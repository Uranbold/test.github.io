<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAV-018 points wireframe</title>
<!--
  Static wireframe of the NAV-018 Android screens (owner: ux-designer). Checks the DESIGN, not the app.
  1 CSS px = 1 dp. Hash parameters: state, theme (day|night), lang (mn|en), scale (1|1.3|2 = Android font scale),
  font (narrow|wide), toolbar (0|1), v (a|b|c: layout alternatives measured in the screen spec; a = chosen design).
  Example: #state=pv-chosen-exp&theme=night&lang=mn&scale=2
  Screen spec: docs/design/screens/NAV-018-android-origin-turn-list.md (delta on the NAV-011 spec, which is a delta on NAV-005).
  The sheet model (handle, top part, summary region, pinned «Эхлэх», sizes) is copied from prototypes/NAV-011-android-preview.html;
  the battery row and hint from prototypes/NAV-012-background.html. Colours are copied from docs/design/tokens.json v0.5.0
  for this wireframe only (tokens.json wins). Window classes as NAV-005 D5: wide = width >= 600, or landscape with width >= 480.
-->
<style>
  :root { --fs: 1; --font: "Liberation Sans", Roboto, sans-serif; }
  :root[data-theme="day"] {
    --surface: #FFFFFF; --surface-container: #F1F3F4; --on-surface: #1F1F1F; --on-surface-variant: #444746;
    --outline: #747775; --outline-variant: #C4C7C5; --primary: #0B57D0; --on-primary: #FFFFFF;
    --primary-container: #D3E3FD; --on-primary-container: #041E49; --error: #B3261E;
    --message-surface: #303030; --on-message-surface: #F2F2F2; --message-outline: #303030; --message-action: #A8C7FA;
    --earth: #F3F0EA; --water: #A8CDEE; --major: #FFFFFF; --major-casing: #C9C2B5;
    --route: #1967D2; --route-casing: #0B3D91; --alt: #8FA7CC; --alt-casing: #5F7CAB;
    --pin: #C5221F; --pin-stroke: #FFFFFF; --disabled: rgba(31,31,31,.38); --handle: #747775;
    --origin-fill: #FFFFFF; --origin-stroke: #1F1F1F; --step-fill: #FFFFFF; --step-stroke: #0B3D91;
    --loc: #1A73E8; --loc-stroke: #FFFFFF; --kbd: #D7DBE0;
  }
  :root[data-theme="night"] {
    --surface: #1F2733; --surface-container: #27303D; --on-surface: #E3E6EA; --on-surface-variant: #B9C0CA;
    --outline: #8B94A1; --outline-variant: #3F4957; --primary: #A8C7FA; --on-primary: #062E6F;
    --primary-container: #0B3D8C; --on-primary-container: #D3E3FD; --error: #F2B8B5;
    --message-surface: #2E3846; --on-message-surface: #E3E6EA; --message-outline: #6E7A8C; --message-action: #A8C7FA;
    --earth: #18202B; --water: #0B2238; --major: #4A5566; --major-casing: #10151C;
    --route: #8AB4F8; --route-casing: #10151C; --alt: #5A7396; --alt-casing: #10151C;
    --pin: #F28B82; --pin-stroke: #10151C; --disabled: rgba(227,230,234,.38); --handle: #8B94A1;
    --origin-fill: #10151C; --origin-stroke: #E3E6EA; --step-fill: #10151C; --step-stroke: #8AB4F8;
    --loc: #669DF6; --loc-stroke: #E8EAED; --kbd: #2B323C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: var(--font); background: var(--earth); color: var(--on-surface); font-size: calc(14px * var(--fs)); line-height: 1.43; }
  #toolbar { position: fixed; z-index: 99; top: 0; left: 0; right: 0; font: 12px sans-serif; background: #fffd; padding: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  #toolbar[hidden], [hidden] { display: none !important; }
  .wrap { overflow-wrap: normal; word-break: normal; hyphens: none; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* status bar 24, 3-button navigation bar 48 (portrait) / 24 (landscape); simulated keyboard (IME) above the nav bar */
  #screen { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: 24px minmax(0,1fr) auto 48px; }
  :root[data-wide="1"][data-orient="land"] #screen { grid-template-rows: 24px minmax(0,1fr) auto 24px; }
  #ime { background: var(--kbd); height: 0; }
  :root[data-ime="1"] #ime { height: 260px; }
  :root[data-ime="1"][data-orient="land"] #ime { height: 170px; }
  #app { position: relative; min-height: 0; display: flex; flex-direction: column; }
  #map { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  #map svg.base { width: 100%; height: 100%; display: block; }
  #markers { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #layer { position: relative; z-index: 2; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  #attr { position: relative; z-index: 3; flex: none; background: var(--surface-container); color: var(--on-surface-variant); font-size: calc(12px * var(--fs)); line-height: 1.333; padding: 4px 16px; min-height: 24px; }

  .elev { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15); }
  :root[data-theme="night"] .elev { box-shadow: none; outline: 1px solid var(--outline-variant); }
  .iconbtn { width: 48px; height: 48px; flex: none; border-radius: 12px; background: var(--surface); color: var(--on-surface); border: 0; display: grid; place-items: center; padding: 0; }
  .iconbtn.flat { background: transparent; box-shadow: none; outline: 0; }
  .iconbtn[aria-disabled="true"] { color: var(--disabled); }
  .iconbtn svg, .ico svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
  .ico { width: 24px; height: 24px; display: block; flex: none; }
  .btn { min-height: 48px; min-width: 48px; border-radius: 9999px; font: inherit; font-size: calc(14px * var(--fs)); font-weight: 500; padding: 8px 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; text-align: center; }
  .btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.5; }
  .btn.filled { background: var(--primary); color: var(--on-primary); }
  .btn.filled:disabled { background: var(--disabled); color: var(--surface); }
  .btn.text { background: transparent; color: var(--primary); padding: 8px 12px; }
  .btn.text:disabled { color: var(--disabled); }
  .btn.msgtext { background: transparent; color: var(--message-action); padding: 8px 12px; }
  .btn.tonal { background: var(--primary-container); color: var(--on-primary-container); }

  /* ---------- points block (fields + close + swap) ---------- */
  .points { display: grid; grid-template-columns: 48px minmax(0,1fr) 48px; column-gap: 4px; padding: 0 4px 4px; align-items: start; }
  .points .close { grid-column: 1; grid-row: 1; }
  .points .fields { grid-column: 2; grid-row: 1; background: var(--surface-container); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; }
  .points .swap { grid-column: 3; grid-row: 1; align-self: center; }
  .points.titled { grid-template-columns: minmax(0,1fr) 48px; padding-left: 12px; }
  .points.titled .fields { grid-column: 1; }
  .points.titled .swap { grid-column: 2; }
  .field { min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 4px 12px; font-size: calc(16px * var(--fs)); color: var(--on-surface); min-width: 0; }
  .field.ph { color: var(--on-surface-variant); }
  .field.me { color: var(--primary); }
  .field .ring { width: 24px; height: 24px; flex: none; display: grid; place-items: center; color: var(--on-surface-variant); }
  .field.me .ring { color: var(--primary); }
  .field .ring svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
  .fdiv { height: 0; box-shadow: 0 0 0 .5px var(--outline-variant); margin-left: 48px; }
  .pinico { width: 20px; height: 20px; flex: none; margin: 0 2px; border-radius: 50% 50% 50% 0; background: var(--pin); transform: rotate(-45deg); }

  /* ---------- S3 route preview sheet (NAV-011 model) ---------- */
  #previewwrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; }
  #routeband { flex: 1 1 0; min-height: 0; }
  #sheet { flex: none; margin: 0 8px 8px; background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; }
  #sheet.expanded { max-height: 80%; flex: 0 1 auto; }
  .handle { flex: none; height: 24px; display: grid; place-items: center; }
  .handle i { display: block; width: 32px; height: 4px; border-radius: 2px; background: var(--handle); }
  #topscroll, #body { flex: 0 1 auto; min-height: 0; overflow: auto; }
  #sheet > .sum, #sheet > .pstate, #sheet > .start, #sheet > .entryreg { flex: none; }
  #sheet .start { border-top: 1px solid transparent; }
  #sheet.expanded .start { border-top-color: var(--outline-variant); }
  #more { border-top: 1px solid var(--outline-variant); margin-top: 8px; }
  #sheet .head { display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px; }
  #sheet .head .tt { flex: 1; min-width: 0; }
  #sheet .head .title { font-size: calc(16px * var(--fs)); font-weight: 600; line-height: 1.5; }
  .tabs { display: flex; border-bottom: 1px solid var(--outline-variant); }
  .tab { flex: 1 1 0; min-width: 0; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px 4px; font: inherit; font-size: calc(14px * var(--fs)); font-weight: 500; color: var(--on-surface-variant); border: 0; background: none; }
  .tab svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; }
  .tab.sel { color: var(--primary); box-shadow: inset 0 -3px 0 var(--primary); }
  :root[data-stackedtabs="1"] .tab { flex-direction: column; gap: 2px; min-height: 64px; }
  .sum { padding: 8px 16px 0; }
  .sum .rn { font-size: calc(14px * var(--fs)); font-weight: 500; color: var(--primary); }
  .sum .dur { font-size: calc(22px * var(--fs)); line-height: 1.27; font-weight: 500; font-variant-numeric: tabular-nums; }
  .sum .dist { font-size: calc(16px * var(--fs)); color: var(--on-surface-variant); }
  .sum .eta { font-variant-numeric: tabular-nums; }
  .pstate { padding: 8px 16px 0; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 4px 12px; }
  .pstate .acts { grid-column: 2; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0 8px; }
  .pstate .sub { color: var(--on-surface-variant); }
  .spin { width: 20px; height: 20px; margin: 2px; border-radius: 50%; border: 3px solid var(--outline-variant); border-top-color: var(--primary); }
  .start { padding: 8px 16px 12px; }
  .start .btn { width: 100%; min-height: 56px; font-size: calc(16px * var(--fs)); }
  /* O1 hint (NAV-018 AC 15): v=a/b above the pinned «Эхлэх»; v=c beside it */
  .o1 { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 8px; align-items: start; padding: 0 0 8px; color: var(--on-surface-variant); }
  .o1 svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; display: block; }
  .start.side { display: flex; align-items: center; gap: 12px; }
  .start.side .btn { width: auto; flex: none; padding: 8px 20px; }
  .start.side .o1 { padding: 0; flex: 1 1 0; min-width: 0; }
  .grp { padding: 8px 0 0; }
  .grp .gh { padding: 0 16px 4px; font-size: calc(14px * var(--fs)); font-weight: 500; color: var(--on-surface-variant); }
  .opt { min-height: 56px; display: grid; grid-template-columns: 20px 24px minmax(0,1fr); align-items: center; gap: 16px; padding: 4px 16px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
  .opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--on-surface-variant); }
  .opt.sel .radio { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 10px var(--primary); }
  .opt .sw { width: 24px; height: 6px; border-radius: 3px; background: var(--alt); outline: 1px solid var(--alt-casing); }
  .opt.sel .sw { background: var(--route); outline-color: var(--route-casing); }
  .opt .ol { font-size: calc(16px * var(--fs)); font-weight: 500; }
  .opt .om { color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
  .switchrow { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 16px; width: 100%; border: 0; background: none; color: inherit; font: inherit; font-size: calc(14px * var(--fs)); text-align: left; }
  .track { width: 52px; height: 32px; flex: none; border-radius: 16px; border: 2px solid var(--outline); }
  /* NAV-012 battery entry row (collapsed) and hint (expanded), copied */
  .entryreg { padding: 0 16px; }
  .batrow { margin: 0; min-height: 48px; width: 100%; border: 0; border-radius: 12px; background: var(--surface-container); color: var(--on-surface); display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 16px; font: inherit; font-size: calc(14px * var(--fs)); text-align: left; }
  .batrow span.l { flex: 1 1 0; width: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .batrow svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; }
  .batrow svg.warn { stroke: var(--error); }
  .hintrow { margin: 8px 16px 0; padding: 12px 12px 4px 16px; border-radius: 12px; background: var(--surface-container); }
  .hintrow .acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 0 8px; margin-top: 4px; }
  .hintrow .acts .bi { margin-right: auto; color: var(--on-surface-variant); }
  .hintrow svg { display: block; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
  /* turn list «Маршрутын заавар» */
  .steps { border-top: 1px solid var(--outline-variant); margin-top: 8px; padding-bottom: 8px; }
  .steps h3 { margin: 0; padding: 12px 16px 4px; font-size: calc(16px * var(--fs)); font-weight: 600; line-height: 1.5; }
  .step { position: relative; min-height: 56px; display: grid; grid-template-columns: 24px minmax(0,1fr) auto; align-items: start; gap: 16px; padding: 8px 16px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
  .step .si { color: var(--on-surface-variant); padding-top: 2px; }
  .step .si svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; display: block; }
  .step .ins { font-size: calc(16px * var(--fs)); line-height: 1.5; }
  .step .st { color: var(--on-surface-variant); }
  .step .sd { color: var(--on-surface-variant); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 2px; }
  :root[data-stackedtabs="1"] .step { grid-template-columns: 24px minmax(0,1fr); }
  :root[data-stackedtabs="1"] .step .sd { grid-column: 2; padding-top: 0; }
  .step.act::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 4px; border-radius: 0 2px 2px 0; background: var(--route); }

  /* ---------- point editor (search row look of NAV-005 S1/S2 as built) ---------- */
  #editor { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 8px 16px 8px; gap: 8px; }
  .efield { flex: none; min-height: 56px; border-radius: 28px; background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 4px 0 16px; }
  .efield .lbls { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .efield .lb { font-size: calc(12px * var(--fs)); line-height: 1.333; color: var(--on-surface-variant); }
  .efield .tx { font-size: calc(16px * var(--fs)); line-height: 1.5; }
  .efield .tx.sel span { background: var(--primary-container); color: var(--on-primary-container); }
  .efield .tx.ph { color: var(--on-surface-variant); }
  .efield .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--primary); vertical-align: text-bottom; margin-left: 1px; }
  #ebody { flex: 0 1 auto; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 2px; }
  .elist { flex: none; background: var(--surface); border-radius: 12px; }
  .erow { min-height: 56px; display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--outline-variant); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; color: inherit; font: inherit; text-align: left; }
  .erow:last-child { border-bottom: 0; }
  .erow .n { font-size: calc(16px * var(--fs)); }
  .erow .m { color: var(--on-surface-variant); }
  .erow.me { color: var(--primary); }
  .erow.me .n { font-weight: 500; }
  .erow svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
  .erow > div { min-width: 0; flex: 1; }
  .estate { min-height: 56px; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 4px 16px; padding: 16px; align-items: start; color: var(--on-surface); }
  .lock { background: var(--message-surface); color: var(--on-message-surface); border: 1px solid var(--message-outline); border-radius: 12px; padding: 12px 8px 4px 16px; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 4px 12px; flex: none; }
  .lock .ico { color: var(--on-message-surface); }
  .lock .t { font-size: calc(16px * var(--fs)); line-height: 1.5; font-weight: 500; padding-right: 8px; }
  .lock .h { grid-column: 2; font-size: calc(14px * var(--fs)); opacity: .87; padding-right: 8px; }
  .lock .acts { grid-column: 1 / 3; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  #espacer { flex: 1 1 0; min-height: 0; }
  :root[data-wide="1"] #editor { width: clamp(320px, 40%, 400px); padding: 8px; }

  /* ---------- coordinate card during the preview (NAV-011 card + two buttons) ---------- */
  #cardwrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 8px 8px; }
  :root[data-wide="1"] #cardwrap { width: clamp(320px, 40%, 400px); }
  .card { background: var(--surface); border-radius: 16px; width: 100%; display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; }
  .card .scroll { overflow: auto; min-height: 0; padding: 4px 0 0; }
  .card .head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0 16px; font-size: calc(16px * var(--fs)); font-weight: 600; }
  .card .coord { padding: 0 16px; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
  .near { margin: 8px 16px 0; min-height: calc(64px * var(--fs)); padding-top: 8px; border-top: 1px solid var(--outline-variant); }
  .near .lbl { font-size: calc(12px * var(--fs)); line-height: 1.333; color: var(--on-surface-variant); font-weight: 500; }
  .near .pn { font-size: calc(16px * var(--fs)); }
  .near .pm { color: var(--on-surface-variant); }
  .near .stt { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 0 12px; align-items: start; }
  .near .stt .acts { grid-column: 2; display: flex; justify-content: flex-end; }
  .card .go { flex: none; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .card .go .btn { width: 100%; }
  .card .go .btn .pinico { width: 16px; height: 16px; background: currentColor; }

  /* wide window: side sheet at the start edge, full height, «Эхлэх» pinned at the bottom */
  :root[data-wide="1"] #previewwrap { flex-direction: row; justify-content: flex-start; align-items: stretch; }
  :root[data-wide="1"] #sheet { width: clamp(320px, 40%, 400px); margin: 8px; max-height: none; flex: none; }
  :root[data-wide="1"] #sheet .handle { display: none; }
  :root[data-wide="1"] #sideScroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
  :root[data-wide="0"] #sideScroll { display: contents; }
  :root[data-wide="1"] #routeband { display: none; }
  :root[data-wide="1"] .points { padding-top: 8px; }
</style>
</head>
<body>
<div id="toolbar"></div>
<div id="screen">
  <div></div>
  <div id="app">
    <div id="map"></div>
    <div id="markers"></div>
    <div id="layer"></div>
    <div id="attr" data-box="attribution">© OpenStreetMap contributors</div>
  </div>
  <div id="ime" data-box="keyboard"></div>
  <div></div>
</div>
<script>
// Every mn value is a glossary term (O1, K1–K3 and B2 are `needs native review`). en values = the existing Android/web en resources.
const T = {
  mn: {
    close: "Хаах", origin: "Эхлэх цэг", dest: "Очих газар", originPh: "Эхлэх цэг сонгох", destPh: "Очих газар сонгох",
    myLoc: "Миний байршил", point: "Сонгосон цэг", swap: "Эхлэх цэг, очих газрыг солих", directions: "Маршрутын заавар",
    setOrigin: "Эхлэх цэг болгох", setDest: "Очих газар болгох", o1: "Замчлал зөвхөн таны байршлаас эхэлнэ",
    title: "Маршрут харах", destName: "Зайсан толгой", pickup: "Гандан хийд", typed: "Gandan",
    r: [["Гандан хийд", "Хийд · Сонгинохайрхан дүүрэг, 7-р хороо"], ["Гандангийн гудамж", "Гудамж · Сонгинохайрхан дүүрэг"], ["Гандан плаза", "Худалдааны төв · Баянгол дүүрэг, 2-р хороо"]],
    rDest: [["Зайсан толгой", "Дурсгалт газар · Хан-Уул дүүрэг, 11-р хороо"], ["Зайсангийн гудамж", "Гудамж · Хан-Уул дүүрэг"]],

    : `<span title="location" style="position:absolute;left:calc(30% - 9px);top:calc(92% - 9px);width:18px;height:18px;border-radius:50%;background:var(--loc);border:3px solid var(--loc-stroke)"></span>`);
  if (isPv) mk.push(`<span class="pinico" style="position:absolute;left:calc(75% - 10px);top:calc(20% - 24px);width:24px;height:24px;border:2px solid var(--pin-stroke)"></span>`);
  if (st === "pv-list") mk.push(`<span style="position:absolute;left:calc(30% - 6px);top:calc(45% - 6px);width:12px;height:12px;border-radius:50%;background:var(--step-fill);border:3px solid var(--step-stroke)"></span>`);
  if (isCard) mk.push(`<span class="pinico" style="position:absolute;left:calc(50% - 10px);top:calc(35% - 24px);width:24px;height:24px;background:var(--surface);border:2px solid var(--pin)"></span>`);
  $("markers").innerHTML = mk.join("");
  $("layer").innerHTML = isPv ? preview(t, st, root.dataset.wide === "1", P.v) : isEd ? editor(t, st) : card(t, st);
  // Collapsed sheet cap (screen spec Layout rule Q3): the top part (points block + tabs) gets what is left of the cap after the
  // summary region, the battery entry row and the footer; it scrolls (and may scroll out) before any of them would.
  const ts = $("topscroll");
  if (ts) {
    const sheet = $("sheet"), wrap = $("previewwrap");
    const fixedH = [...sheet.children].filter((c) => c !== ts).reduce((a, c) => a + c.getBoundingClientRect().height, 0);
    const area = wrap.clientHeight, band = P.scale > 1 ? 96 : 160;
    const cap = innerWidth >= 360 && innerHeight >= 640 ? Math.min(area * 0.75, area - band - 8) : area * 0.6;
    ts.style.maxHeight = Math.max(0, Math.floor(cap - fixedH)) + "px";
    // Q3 last resort (font scale > 100 % only): if the summary region, the battery entry row and the footer alone exceed
    // the cap, the entry row joins the top part (it scrolls after the points block and the tabs).
    const entry = sheet.querySelector(":scope > [data-entry]");
    if (entry && P.scale > 1 && fixedH > cap) {
      ts.appendChild(entry);
      const fixed2 = [...sheet.children].filter((c) => c !== ts).reduce((a, c) => a + c.getBoundingClientRect().height, 0);
      ts.style.maxHeight = Math.max(0, Math.floor(cap - fixed2)) + "px";
    }
  }
  if (st === "pv-list") { const b = $("body") || $("sideScroll"); const a = document.querySelector(".step.act"); if (b && a) b.scrollTop += a.getBoundingClientRect().bottom - b.getBoundingClientRect().bottom + 8; }
  renderToolbar(P);
}
function renderToolbar(P) {
  const tb = $("toolbar"); tb.hidden = !P.toolbar; if (!P.toolbar) return;
  const sel = (k, vals) => `<select data-k="${k}">${vals.map((v) => `<option ${String(P[k]) === String(v) ? "selected" : ""}>${v}</option>`).join("")}</select>`;
  tb.innerHTML = sel("state", STATES) + sel("theme", ["day", "night"]) + sel("lang", ["mn", "en"]) + sel("scale", [1, 1.3, 2]) + sel("font", ["narrow", "wide"]) + sel("v", ["a", "b", "c"]);
  tb.querySelectorAll("select").forEach((s) => s.onchange = () => {
    const p = params(); p[s.dataset.k] = s.value;
    location.hash = Object.entries(p).map(([k, v]) => `${k}=${k === "toolbar" ? (v ? 1 : 0) : v}`).join("&");
  });
}
addEventListener("hashchange", render);
addEventListener("resize", render);
render();
</script>
