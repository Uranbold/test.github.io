<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAV-017 demo mode wireframe</title>
<!--
  Static wireframe of the NAV-017 web demo mode (owner: ux-designer). Checks the DESIGN, not the app.
  CSS px (iPhone Safari: 1 CSS px = 1 pt). Hash parameters:
    state  picker | picker-selected | picker-loading | picker-error | picker-offline |
           guidance | long | notice | recenter | offline | worst | arrival
    theme  day | night         lang  mn | en          tz  1 | 2 (text zoom: root font size 100 % / 200 %)
    insets t,r,b,l             simulated env(safe-area-inset-*) in px, e.g. 0,47,21,47 (landscape notch)
    font   narrow | wide       narrow = Liberation Sans (Arial/Helvetica metrics, close to SF Pro text),
                               wide = DejaVu Sans (much wider, stress test)
    toolbar 0 | 1
  Example: #state=worst&theme=night&lang=mn&tz=2&insets=0,0,34,0
  Layout rules: docs/design/screens/NAV-017-web-demo-mode.md. Banner rules: docs/design/navigation-ux.md §2, §11.
  Colours are copied from docs/design/tokens.json v0.5.0 for this wireframe only (tokens.json wins).
  Place names, distances and times below are PLACEHOLDERS; the real values come from the demo route manifest (QA).
-->
<style>
  :root { --tz: 1; --fsB: 1; --fsD: 1; --sat: 0px; --sar: 0px; --sab: 0px; --sal: 0px;
    --font: "Liberation Sans", -apple-system, "Helvetica Neue", sans-serif; }
  :root[data-theme="day"] {
    --surface: #FFFFFF; --surface-container: #F1F3F4; --on-surface: #1F1F1F; --on-surface-variant: #444746;
    --outline: #747775; --outline-variant: #C4C7C5; --primary: #0B57D0; --on-primary: #FFFFFF;
    --primary-container: #D3E3FD; --on-primary-container: #041E49; --error: #B3261E;
    --error-container: #F9DEDC; --on-error-container: #410E0B;
    --message-surface: #303030; --on-message-surface: #F2F2F2; --message-outline: #303030;
    --banner: #0F6B45; --on-banner: #FFFFFF; --on-banner-variant: #D2EBDD; --banner-outline: #0F6B45;
    --badge: #FDE293; --on-badge: #3C2F00; --badge-outline: #8A6D00;
    --earth: #F3F0EA; --water: #A8CDEE; --major: #FFFFFF; --major-casing: #C9C2B5;
    --route: #1967D2; --route-casing: #0B3D91;
    --puck: #1A73E8; --puck-stroke: #FFFFFF; --puck-outline: #0B3D91; --pin: #C5221F;
    --disabled-bg: rgba(31,31,31,.12); --disabled: rgba(31,31,31,.38);
  }
  :root[data-theme="night"] {
    --surface: #1F2733; --surface-container: #27303D; --on-surface: #E3E6EA; --on-surface-variant: #B9C0CA;
    --outline: #8B94A1; --outline-variant: #3F4957; --primary: #A8C7FA; --on-primary: #062E6F;
    --primary-container: #0B3D8C; --on-primary-container: #D3E3FD; --error: #F2B8B5;
    --error-container: #601410; --on-error-container: #F9DEDC;
    --message-surface: #2E3846; --on-message-surface: #E3E6EA; --message-outline: #6E7A8C;
    --banner: #123D2C; --on-banner: #E3E6EA; --on-banner-variant: #B7D3C5; --banner-outline: #3E7A5E;
    --badge: #3D3200; --on-badge: #F5DD8C; --badge-outline: #8A7A3C;
    --earth: #18202B; --water: #0B2238; --major: #4A5566; --major-casing: #10151C;
    --route: #8AB4F8; --route-casing: #10151C;
    --puck: #E8EAED; --puck-stroke: #10151C; --puck-outline: #10151C; --pin: #F28B82;
    --disabled-bg: rgba(227,230,234,.12); --disabled: rgba(227,230,234,.38);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { font-family: var(--font); background: var(--earth); color: var(--on-surface); font-size: calc(14px * var(--tz)); line-height: 1.43; }
  #toolbar { position: fixed; z-index: 99; top: 0; left: 0; right: 0; font: 12px sans-serif; background: #fffd; padding: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  #toolbar[hidden], [hidden] { display: none !important; }
  /* The app is sized to the VISIBLE viewport (position: fixed; inset: 0), never 100vh (iOS: 100vh includes the area under Safari's toolbar). */
  #app { position: fixed; inset: 0; display: grid; min-height: 0; }
  #map { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  #map svg { width: 100%; height: 100%; display: block; }
  /* Simulated safe-area bands (drawn only so a screenshot shows them; the checker reads the CSS variables). */
  .inset { position: absolute; z-index: 50; pointer-events: none; background: repeating-linear-gradient(45deg, #f004 0 4px, transparent 4px 8px); }

  .iconbtn { width: 48px; height: 48px; border-radius: 12px; background: var(--surface); color: var(--on-surface); border: 0; display: grid; place-items: center; flex: none; box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15); }
  :root[data-theme="night"] .iconbtn { box-shadow: none; outline: 1px solid var(--outline-variant); }
  .iconbtn.flat { box-shadow: none; outline: 0; background: transparent; }
  .iconbtn svg, .btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
  .langbtn { min-width: 48px; height: 48px; padding: 0 12px; border-radius: 8px; background: var(--surface); color: var(--on-surface); border: 1px solid var(--outline); font: inherit; font-size: calc(14px * var(--tz)); font-weight: 500; white-space: nowrap; flex: none; }
  .btn { min-height: 48px; min-width: 48px; border-radius: 9999px; font: inherit; font-weight: 500; padding: 8px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; text-align: left; }
  .btn.filled { background: var(--primary); color: var(--on-primary); }
  .btn.filled:disabled { background: var(--disabled-bg); color: var(--disabled); }
  .btn.text { background: transparent; color: var(--primary); padding: 8px 12px; }
  .btn.round { width: 48px; height: 48px; padding: 0; flex: none; background: transparent; color: var(--error); border: 1px solid var(--outline); }
  .card { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15); }
  :root[data-theme="night"] .card { box-shadow: none; outline: 1px solid var(--outline-variant); }
  .msg { background: var(--message-surface); color: var(--on-message-surface); border: 1px solid var(--message-outline); border-radius: 8px; padding: 12px 16px; display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 12px; align-items: start; }
  .msg .ico, .state .ico { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; }
  #attr { position: relative; z-index: 3; grid-row: -2; grid-column: 1 / -1; background: var(--surface-container); color: var(--on-surface-variant);
    font-size: max(12px, calc(12px * var(--tz))); line-height: 1.333; padding: 4px calc(16px + var(--sar)) calc(4px + var(--sab)) calc(16px + var(--sal)); min-height: 24px; }
  #attr a { color: inherit; text-decoration: underline; }

  /* ===== D1 picker: NAV-002/NAV-004 grid, compact = bottom sheet, expanded (>= 840 px) = side panel ===== */
  :root[data-view="picker"] #app { grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,auto) minmax(0,1fr) auto minmax(0,auto) auto; }
  #r1 { grid-row: 1; grid-column: 1; z-index: 2; display: flex; justify-content: flex-end; gap: 8px; padding: calc(12px + var(--sat)) calc(16px + var(--sar)) 8px calc(16px + var(--sal)); }
  #r2 { grid-row: 2; grid-column: 1; z-index: 2; padding: 0 calc(16px + var(--sar)) 0 calc(16px + var(--sal)); overflow: auto; min-height: 0; }
  #r4 { grid-row: 4; grid-column: 1; z-index: 2; display: flex; justify-content: space-between; align-items: flex-end; padding: 8px calc(16px + var(--sar)) 8px calc(16px + var(--sal)); }
  #r4 .scale { font-size: calc(12px * var(--tz)); background: var(--surface-container); color: var(--on-surface); padding: 2px 6px; border-radius: 4px; }
  #r4 .zoom { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--surface); }
  #slot { grid-row: 5; grid-column: 1; z-index: 2; padding: 0 calc(16px + var(--sar)) 20px calc(16px + var(--sal)); min-height: 0; display: flex; }
  /* The list scrolls between the pinned heading and the pinned footer; if even those do not fit (extreme text zoom), the whole sheet scrolls. */
  #picker { background: var(--surface); border-radius: 8px; width: 100%; max-height: 60dvh; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #picker .scroll { min-height: 64px; }
  :root[data-view="picker"][data-wide="1"] #app { grid-template-columns: calc(432px + var(--sal)) minmax(0,1fr); }
  :root[data-view="picker"][data-wide="1"] #slot { grid-column: 1; grid-row: 1 / 6; padding: calc(12px + var(--sat)) 16px 20px calc(16px + var(--sal)); }
  :root[data-view="picker"][data-wide="1"] #picker { max-height: none; max-width: 400px; }
  :root[data-view="picker"][data-wide="1"] #r1, :root[data-view="picker"][data-wide="1"] #r2, :root[data-view="picker"][data-wide="1"] #r4 { grid-column: 2; }
  :root[data-view="picker"][data-wide="1"] #r1, :root[data-view="picker"][data-wide="1"] #r2, :root[data-view="picker"][data-wide="1"] #r4 { padding-left: 16px; }
  #picker .head { padding: 12px 16px 0; font-size: calc(16px * var(--tz)); line-height: 1.5; font-weight: 600; flex: none; }
  #picker .scroll { overflow: auto; min-height: 0; flex: 1 1 auto; overscroll-behavior: contain; }
  #picker .label { padding: 0 16px 4px; font-size: calc(14px * var(--tz)); font-weight: 500; color: var(--on-surface-variant); }
  .entry { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 16px; padding: 8px 16px; min-height: 56px; width: 100%; border: 0; background: none; color: inherit; font: inherit; text-align: left; border-top: 1px solid var(--outline-variant); }
  .entry .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--on-surface-variant); margin-top: 2px; }
  .entry[aria-checked="true"] .radio { border-color: var(--primary); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 10px var(--primary); }
  .entry .pt { display: grid; grid-template-columns: 16px minmax(0,1fr); gap: 8px; align-items: start; font-size: calc(16px * var(--tz)); line-height: 1.5; }
  .entry .pt i { width: 12px; height: 12px; margin-top: calc(6px * var(--tz)); border-radius: 50%; border: 3px solid var(--on-surface); }
  .entry .pt i.pin { border: 0; background: var(--pin); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
  .entry .meta { font-size: calc(14px * var(--tz)); color: var(--on-surface-variant); font-variant-numeric: tabular-nums; margin-top: 2px; }
  /* State row: pinned above «Эхлэх» (outside the scrolling list) so it is always visible next to the button it explains. */
  .state { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 4px 12px; padding: 8px 16px; min-height: 56px; align-items: center; border-top: 1px solid var(--outline-variant); flex: none; }
  /* NAV-002 rule 5: the action sits at the end of the text line; below a 480 px viewport (or above 100 % text zoom) it gets its own line. */
  .state { grid-template-columns: 24px minmax(0,1fr) auto; }
  .state .acts { display: flex; justify-content: flex-end; }
  :root[data-narrow="1"] .state { grid-template-columns: 24px minmax(0,1fr); }
  :root[data-narrow="1"] .state .acts { grid-column: 2; }
  #picker .foot { padding: 8px 16px 12px; flex: none; border-top: 1px solid var(--outline-variant); }
  #picker .foot .btn { width: 100%; min-height: 56px; font-size: calc(16px * var(--tz)); }

  /* ===== D2 guidance / D3 arrival ===== */
  :root[data-view="nav"] #app { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,auto) minmax(0,1fr) auto auto; }
  #top { grid-row: 1; grid-column: 1; z-index: 2; padding: calc(8px + var(--sat)) calc(8px + var(--sar)) 0 calc(8px + var(--sal)); overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #band { grid-row: 2; grid-column: 1; position: relative; z-index: 1; min-height: 0; }
  #bottom { grid-row: 3; grid-column: 1; z-index: 2; padding: 0 calc(8px + var(--sar)) 20px calc(8px + var(--sal)); display: flex; flex-direction: column; gap: 8px; }
  :root[data-view="nav"][data-wide="1"] #app { grid-template-columns: calc(clamp(320px, 40%, 400px) + var(--sal)) minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto auto; }
  :root[data-view="nav"][data-wide="1"] #top { grid-row: 1 / 3; padding-right: 0; padding-bottom: 8px; }
  :root[data-view="nav"][data-wide="1"] #band { grid-column: 2; grid-row: 1; }
  :root[data-view="nav"][data-wide="1"] #bottom { grid-column: 2; grid-row: 2; padding-left: 8px; }
  #banner { background: var(--banner); color: var(--on-banner); border: 1px solid var(--banner-outline); border-radius: 16px; padding: 16px; display: grid; grid-template-columns: 56px minmax(0,1fr); column-gap: 12px; min-height: 104px; flex: none; }
  #banner .icon svg { width: 56px; height: 56px; fill: none; stroke: var(--on-banner); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  #banner .dist { font-size: calc(32px * var(--fsD)); line-height: 1.25; font-weight: 700; font-variant-numeric: tabular-nums; }
  #banner .instr { font-size: calc(24px * var(--fsB)); line-height: 1.25; font-weight: 500; }
  #banner .street { font-size: calc(18px * var(--fsB)); line-height: 1.333; color: var(--on-banner-variant); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Web stacked layout (text zoom >= 115 %): padding 12 16 and a 48 px icon (navigation-ux §11.3), so a 375 px phone at 200 % keeps its map band. */
  :root[data-stacked="1"] #banner { grid-template-areas: "icon dist" "text text"; grid-template-columns: 48px minmax(0,1fr); padding: 12px 16px; min-height: 0; }
  :root[data-stacked="1"] #banner .icon svg { width: 48px; height: 48px; }
  :root[data-stacked="1"] #banner .icon { grid-area: icon; }
  :root[data-stacked="1"] #banner .dist { grid-area: dist; align-self: center; }
  :root[data-stacked="1"] #banner .textcol { grid-area: text; margin-top: 8px; }
  :root[data-stacked="1"] #banner.nodist { grid-template-areas: "icon ." "text text"; }
  /* RD demo row: badge + language + theme */
  #rd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: nowrap; flex: none; min-height: 48px; }
  #rd .btns { display: flex; gap: 8px; margin-left: auto; }
  #rd .langbtn { font-size: calc(14px * var(--fsB)); }
  .badge { display: inline-flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; min-height: 32px; padding: 4px 12px 4px 8px; border-radius: 16px; background: var(--badge); color: var(--on-badge); border: 1px solid var(--badge-outline);
    font-size: calc(14px * var(--fsB)); line-height: 1.43; font-weight: 600; }
  .badge svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
  .badge span { min-width: 0; overflow-wrap: normal; }
  #rs .msg { font-size: calc(14px * var(--fsB)); }
  #recenter { position: absolute; left: calc(16px + var(--sal)); bottom: 12px; min-height: 56px; max-width: calc(100% - 32px - var(--sal)); border-radius: 16px; background: var(--primary-container); color: var(--on-primary-container); border: 0; padding: 8px 20px 8px 16px; display: flex; align-items: center; gap: 12px; font: inherit; font-size: calc(14px * var(--fsB)); font-weight: 500; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15); }
  :root[data-wide="1"] #recenter { left: 16px; max-width: calc(100% - 32px); }
  #recenter svg { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; }
  .notice { background: var(--message-surface); color: var(--on-message-surface); border: 1px solid var(--message-outline); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: calc(14px * var(--fsB)); }
  .notice .item { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 12px; }
  .notice .ico { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; }
  .panel { background: var(--surface); color: var(--on-surface); border-radius: 16px; padding: 12px 12px 12px 16px; min-height: 72px; display: flex; align-items: center; gap: 8px; }
  .panel .txt { min-width: 0; flex: 1 1 0; }
  .panel .eta { font-size: calc(22px * var(--fsB)); line-height: 1.27; font-weight: 500; font-variant-numeric: tabular-nums; }
  .panel .eta small { font-size: calc(16px * var(--fsB)); color: var(--on-surface-variant); font-weight: 400; }
  .panel .meta { font-size: calc(16px * var(--fsB)); line-height: 1.5; color: var(--on-surface-variant); font-variant-numeric: tabular-nums; }
  .panel .dest { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 8px; font-size: calc(22px * var(--fsB)); line-height: 1.27; font-weight: 500; }
  .panel .dest svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
</style>
</head>

  play: '<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',
  flask: '<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg>',
  car: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v-4l2-5h12l2 5v4zM6 16v2M18 16v2"/></svg>',
  walk: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13" cy="4" r="2"/><path d="M11 21l2-7-3-3 1-4 4 3 3 1M9 12l-2 4"/></svg>',
};
function params() {
  const p = new URLSearchParams(location.hash.slice(1));
  const ins = (p.get("insets") || "0,0,0,0").split(",").map(Number);
  return { state: STATES.includes(p.get("state")) ? p.get("state") : "picker", theme: p.get("theme") === "night" ? "night" : "day",
    lang: p.get("lang") === "en" ? "en" : "mn", tz: Number(p.get("tz")) || 1, font: p.get("font") || "narrow",
    insets: ins.length === 4 ? ins : [0, 0, 0, 0], toolbar: p.get("toolbar") !== "0" };
}
const fmtKm = (t, [a, b]) => `${a}${t.dec}${b} ${t.km}`;
function mapSvg(withRoute) {
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><rect width="100" height="100" fill="var(--earth)"/>
    <path d="M0 62 C30 58 60 70 100 66" stroke="var(--water)" stroke-width="3" fill="none"/>
    <path d="M50 100 V0 M0 40 H100" stroke="var(--major-casing)" stroke-width="3.2"/><path d="M50 100 V0 M0 40 H100" stroke="var(--major)" stroke-width="2.4"/>
    ${withRoute ? `<path d="M50 100 V40 H100" stroke="var(--route-casing)" fill="none" vector-effect="non-scaling-stroke" style="stroke-width:14px"/>
    <path d="M50 100 V40 H100" stroke="var(--route)" fill="none" vector-effect="non-scaling-stroke" style="stroke-width:9px"/>` : ""}</svg>`;
}
function render() {
  const P = params(), t = T[P.lang], root = document.documentElement, st = P.state;
  root.lang = P.lang; root.dataset.theme = P.theme;
  const [it, ir, ib, il] = P.insets;
  for (const [k, v] of [["--sat", it], ["--sar", ir], ["--sab", ib], ["--sal", il]]) root.style.setProperty(k, v + "px");
  root.style.setProperty("--tz", P.tz);
  // navigation-ux §2.5 / §11: guidance overlay text capped at 1.3 (banner distance 1.2); stacked banner from 1.15.
  root.style.setProperty("--fsB", Math.min(P.tz, 1.3)); root.style.setProperty("--fsD", Math.min(P.tz, 1.2));
  root.dataset.stacked = Math.min(P.tz, 1.3) >= 1.15 ? "1" : "0";
  root.style.setProperty("--font", P.font === "wide" ? '"DejaVu Sans", sans-serif' : '"Liberation Sans", -apple-system, sans-serif');
  const picker = st.startsWith("picker");
  root.dataset.view = picker ? "picker" : "nav";
  // Column layouts: picker side panel from 840 px (NAV-004 expanded); guidance left column from 840 px or on a phone in landscape (height < 500).
  const W = innerWidth, H = innerHeight;
  root.dataset.wide = (W >= 840 || (!picker && W > H && H < 500)) ? "1" : "0";
  root.dataset.narrow = (W < 480 || P.tz > 1) ? "1" : "0";
  const themeBtn = P.theme === "day" ? ["moon", t.night] : ["sun", t.day];
  const app = document.getElementById("app");
  const attr = `<div id="attr" data-box="attribution"><a href="#" data-attr-link>© OpenStreetMap contributors</a></div>`;
  const insetDivs = `${it ? `<div class="inset" data-inset style="left:0;right:0;top:0;height:${it}px"></div>` : ""}${ir ? `<div class="inset" data-inset style="top:0;bottom:0;right:0;width:${ir}px"></div>` : ""}${ib ? `<div class="inset" data-inset style="left:0;right:0;bottom:0;height:${ib}px"></div>` : ""}${il ? `<div class="inset" data-inset style="top:0;bottom:0;left:0;width:${il}px"></div>` : ""}`;
  if (picker) {
    const sel = st === "picker" ? -1 : 0;
    const entries = ROUTES.map((r, i) => `<button class="entry" role="radio" aria-checked="${i === sel}" data-control data-entry>
        <span class="radio" aria-hidden="true"></span>
        <span><span class="pt"><i aria-hidden="true"></i><span>${r.o}</span></span><span class="pt"><i class="pin" aria-hidden="true"></i><span>${r.d}</span></span>
        <span class="meta">${r.mode === "car" ? I.car : I.walk} ${r.mode === "car" ? t.car : t.walk} · ${fmtKm(t, r.km)} · ${r.min} ${t.min}</span></span></button>`).join("");
    let stateRow = "";

    if (st === "picker-error") stateRow = `<div class="state" role="status"><span class="ico" aria-hidden="true" style="color:var(--error)"></span><span>${t.error}</span><span class="acts"><button class="btn text" data-control>${t.retry}</button></span></div>`;
    if (st === "picker-offline") stateRow = `<div class="state" role="status"><span class="ico" aria-hidden="true"></span><span>${t.offline}</span></div>`;
    const enabled = st === "picker-selected";
    app.innerHTML = `<div id="map">${mapSvg(st !== "picker")}</div>
      <div id="r1"><button class="langbtn" data-control lang="${P.lang === "mn" ? "en" : "mn"}">${t.lang}</button><button class="iconbtn" data-control aria-label="${themeBtn[1]}">${I[themeBtn[0]]}</button><button class="iconbtn" data-control aria-label="${t.northUp}">${I.compass}</button></div>
      <div id="r2">${st === "picker-offline" ? `<div class="msg card" data-box="status-offline" role="status"><span class="ico" aria-hidden="true"></span><span>${t.offline}</span></div>` : ""}</div>
      <div id="r4"><span class="scale">${t.scale}</span><div class="zoom card"><button class="iconbtn flat" data-control aria-label="${t.zin}">+</button><button class="iconbtn flat" data-control aria-label="${t.zout}">−</button></div></div>
      <div id="slot"><section id="picker" class="card" data-box="picker" aria-labelledby="ph"><h2 id="ph" class="head" style="margin:0" tabindex="-1">${t.demo}</h2>
        <div class="scroll" id="pscroll"><div class="label" id="pl">${t.routes}</div><div role="radiogroup" aria-labelledby="pl">${entries}</div></div>
        ${stateRow}<div class="foot"><button class="btn filled" data-control data-start ${enabled ? "" : "disabled"}>${I.play}<span>${t.start}</span></button></div></section></div>
      ${attr}${insetDivs}`;
  } else {
    let icon = I.right, dist = st === "notice" || st === "offline" ? t.d1 : t.d300, instr = t.turnR, street = t.street, nodist = false;
    if (st === "long" || st === "worst") { icon = I.ramp; instr = t.offRampR; street = t.streetLong; }
    if (st === "arrival") { icon = I.flag; dist = ""; instr = t.arriveR; nodist = true; }
    // RN message stack above the progress panel: A1 notice (8 s, once per replay) and the offline indicator share ONE card (Layout rule 5).
    const items = [];
    if (st === "notice" || st === "worst") items.push(["a1", t.voiceNotice]);
    if (st === "offline" || st === "worst") items.push(["offline", t.offline]);
    const stack = items.length ? `<div class="notice card" data-box="messages" data-has-a1="${items.some((i) => i[0] === "a1")}">${items.map(([k, m]) => `<div class="item" role="status" data-msg="${k}"><span class="ico" aria-hidden="true"></span><span>${m}</span></div>`).join("")}</div>` : "";
    const msgs = "";
    const stacked = root.dataset.stacked === "1";
    const distEl = dist ? `<div class="dist" data-check="distance">${dist}</div>` : "";
    const bottom = stack
      + (st === "arrival"
        ? `<div class="panel card" data-box="progress"><div class="txt"><div class="dest">${I.flag24}<span>${ROUTES[0].d}</span></div></div><button class="btn filled" data-control>${t.close}</button></div>`
        : `<div class="panel card" data-box="progress"><div class="txt"><div class="eta">${t.eta} 14:35</div><div class="meta">${t.remaining}</div></div>
           <button class="iconbtn flat" data-control aria-label="${t.mute}">${I.vol}</button><button class="btn round" data-control aria-label="${t.end}">${I.x}</button></div>`);
    app.innerHTML = `<div id="map">${mapSvg(true)}</div>
      <div id="top"><div id="banner" class="card${nodist ? " nodist" : ""}" data-box="banner"><div class="icon" aria-hidden="true">${icon}</div>${stacked ? distEl : ""}<div class="textcol">${stacked ? "" : distEl}<div class="instr" data-check="instruction">${instr}</div>${street ? `<div class="street">${street}</div>` : ""}</div></div>
        <div id="rd"><span class="badge" data-box="badge">${I.flask}<span>${t.demo}</span></span><span class="btns"><button class="langbtn" data-control lang="${P.lang === "mn" ? "en" : "mn"}">${t.lang}</button><button class="iconbtn" data-control aria-label="${themeBtn[1]}">${I[themeBtn[0]]}</button></span></div>
        ${msgs}</div>
      <div id="band">${(st === "recenter" || st === "worst") ? `<button id="recenter" data-control data-box="recenter">${I.loc}<span>${t.recenter}</span></button>` : ""}
        <div id="puck" style="position:absolute;left:calc(50% + var(--sal) / 2);top:70%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--puck);border:3px solid var(--puck-stroke);outline:1px solid var(--puck-outline)"></div></div>
      <div id="bottom">${bottom}</div>${attr}${insetDivs}`;
    if (root.dataset.wide === "1") {
      const p = document.getElementById("puck"); p.style.left = "50%";
      const m = document.querySelector('[data-box="messages"]'); if (m) document.getElementById("top").appendChild(m);
    }
    document.getElementById("top").style.maxHeight = root.dataset.wide === "1" ? "" : Math.floor(H * 0.5) + "px";
  }
  renderToolbar(P);
}
function renderToolbar(P) {
  const tb = document.getElementById("toolbar"); tb.hidden = !P.toolbar; if (!P.toolbar) return;
  const sel = (k, vals) => `<select data-k="${k}">${vals.map((v) => `<option ${String(P[k]) === String(v) ? "selected" : ""}>${v}</option>`).join("")}</select>`;
  tb.innerHTML = sel("state", STATES) + sel("theme", ["day", "night"]) + sel("lang", ["mn", "en"]) + sel("tz", [1, 2]) + sel("font", ["narrow", "wide"])
    + `<input data-k="insets" size="10" value="${P.insets.join(",")}">`;
  tb.querySelectorAll("select,input").forEach((s) => s.onchange = () => {
    const p = params(); p[s.dataset.k] = s.value;
    location.hash = Object.entries(p).map(([k, v]) => `${k}=${k === "toolbar" ? (v ? 1 : 0) : Array.isArray(v) ? v.join(",") : v}`).join("&");
  });
}
addEventListener("hashchange", render);
addEventListener("resize", render);
render();
</script>
