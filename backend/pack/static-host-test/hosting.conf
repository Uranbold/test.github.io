# NAV-022 test: "typical shared host" defaults on top of the stock httpd.conf (included with -c after it).
# Each line below breaks the offline pack unless the exported .htaccess undoes it:
LoadModule deflate_module modules/mod_deflate.so
LoadModule brotli_module modules/mod_brotli.so
LoadModule expires_module modules/mod_expires.so
LoadModule rewrite_module modules/mod_rewrite.so

# .gz as a content coding -> "Content-Encoding: x-gzip" on the pack files (clients may unpack them on the fly)
AddEncoding x-gzip .gz .tgz
# compress everything else on the fly (mod_deflate skips responses that already carry a Content-Encoding)
SetOutputFilter DEFLATE
AddOutputFilterByType BROTLI_COMPRESS application/json text/plain text/html
# one week of caching for everything, the manifest included
ExpiresActive On
ExpiresDefault "access plus 7 days"

<Directory "/usr/local/apache2/htdocs">
    AllowOverride All
    Require all granted
    # CMS-style front controller: every missing file becomes a 200 HTML page
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule . /index.html [L]
</Directory>
