# NAV-001 gateway (ADR-0002 §3). Replaces the image's nginx.conf; keeps its unprivileged paths.
worker_processes auto;
pid /tmp/nginx.pid;

# njs (bundled with the image): header fix-ups on the tiles 416 (gateway/njs/headers.js), the NAV-006 slot pointer
# (gateway/njs/slot.js) and the per-client limit key (gateway/njs/client.js).
load_module modules/ngx_http_js_module.so;

# Startup/config errors. Request-time errors use the http-level error_log in conf.d/default.conf,
# whose level comes from GATEWAY_ERROR_LOG_LEVEL (default crit, see privacy note there).
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Privacy (ADR-0002 §3.4): path only ($uri, no query string), no client address, no body,
    # no Origin/Referer/User-Agent. Coordinates and search text never reach the logs.
    log_format json_privacy escape=json
        '{"ts":"$time_iso8601","service":"gateway","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json_privacy;

    sendfile           on;
    tcp_nopush         on;
    server_tokens      off;

    # SEC BE-14 (checklist B7/B10, threat model 1.7/1.11): explicit edge timeouts, so a slow or silent client cannot
    # hold a worker connection (and, on /v1/route, a SEC-2 cap slot) for long. Every value is an inactivity timeout
    # between two successive reads/writes, not a total deadline: a throttled whole-archive download (limit_rate,
    # 18-download-limits.sh) keeps writing and is not cut. On staging Caddy sits in front and has its own limits
    # (infra/staging/caddy/Caddyfile); these apply to the Caddy <-> gateway hop and to the dev stack directly.
    client_header_timeout     10s;
    client_body_timeout       10s;
    send_timeout              10s;
    keepalive_timeout         30s;
    keepalive_requests        1000;
    reset_timedout_connection on;
    # Header and body buffers: small and explicit (no request-smuggling-relevant leniency). nginx 1.30 already
    # rejects a request with both Transfer-Encoding and Content-Length (RFC 9112), merges nothing and forwards
    # upstream as HTTP/1.1 (snippets/proxy-common.conf); underscores in header names stay refused (default).
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_buffer_size     256k;
    underscores_in_headers      off;
    ignore_invalid_headers      on;
    # Request body limit: 1 KB for every location (GET/HEAD/OPTIONS paths need no body; over it = JSON 413
    # PayloadTooLarge); only /v1/route raises it to the contract's 256 KB (templates/default.conf.template).
    client_max_body_size        1k;

    # JSON API responses are compressed; the tiles location switches gzip off (byte-exact ranges).
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_types      application/json application/geo+json;

    js_path   /etc/nginx/njs;
    js_import headers from headers.js;
    # SEC-4A BE-2: client key of every per-IP limit (IPv4 = full address, IPv6 = its /64; gateway/njs/client.js).
    js_import client from client.js;
    js_set    $nav_client_key client.key;
    # SEC BE-3 residual: key of the tiles connection cap = the client key for whole-archive and large-range tiles
    # GETs only (ranges below $nav_tiles_cap_bytes, the bandwidth-limit burst, are tile reads and never counted).
    js_set    $nav_tiles_dl_key client.tilesDl;

    include /etc/nginx/conf.d/*.conf;
}
