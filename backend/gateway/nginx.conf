# NAV-001 gateway (ADR-0002 §3). Replaces the image's nginx.conf; keeps its unprivileged paths.
worker_processes auto;
pid /tmp/nginx.pid;

# njs (bundled with the image) is used only to fix up headers on the tiles 416 (gateway/njs/headers.js).
load_module modules/ngx_http_js_module.so;

# Startup/config errors. Request-time errors use the http-level error_log in conf.d/default.conf,
# whose level comes from GATEWAY_ERROR_LOG_LEVEL (default crit, see privacy note there).
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path       /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Privacy (ADR-0002 §3.4): path only ($uri, no query string), no client address, no body,
    # no Origin/Referer/User-Agent. Coordinates and search text never reach the logs.
    log_format json_privacy escape=json
        '{"ts":"$time_iso8601","service":"gateway","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /dev/stdout json_privacy;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # JSON API responses are compressed; the tiles location switches gzip off (byte-exact ranges).
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_proxied    any;
    gzip_types      application/json application/geo+json;

    js_path   /etc/nginx/njs;
    js_import headers from headers.js;

    include /etc/nginx/conf.d/*.conf;
}
