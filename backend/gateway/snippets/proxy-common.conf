# Shared proxy settings for the Valhalla and Photon pass-through locations (ADR-0002 §3).
proxy_http_version    1.1;
proxy_set_header      Connection "";
proxy_set_header      Host $proxy_host;
proxy_connect_timeout 2s;
proxy_send_timeout    10s;
proxy_buffering       on;
# Upstream 4xx bodies (Valhalla / Photon errors) pass through unchanged: proxy_intercept_errors stays at nginx's
# default (off). Only the ROUTE location turns it on, after this include (SEC-2, ADR-0019 §2); it has no
# error_page 400, so Valhalla's 400 bodies still pass through.
# The gateway alone owns CORS: drop whatever the upstream sends (Valhalla always adds "*").
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Max-Age;
