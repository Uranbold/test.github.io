# CORS response headers (ADR-0002 §3.1) plus X-Content-Type-Options (SEC-4A). Included in every location because
# nginx drops inherited add_header directives as soon as a location defines its own.
# An empty $cors_allow_origin (disallowed origin) means the header is not sent at all.
add_header Access-Control-Allow-Origin   $cors_allow_origin always;
add_header Access-Control-Allow-Methods  "GET, HEAD, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers  "Range, Content-Type, If-None-Match, If-Match, Accept-Language" always;
# Expose-Headers list = openapi.yaml AccessControlExposeHeaders (Retry-After since 0.4.0, NAV-008).
add_header Access-Control-Expose-Headers "Content-Range, Content-Length, ETag, Accept-Ranges, Retry-After" always;
add_header Access-Control-Max-Age        600 always;
add_header Vary                          Origin always;
# SEC-4A BE-12/BE-13: not CORS, but needed on every response too, and every location includes this file.
add_header X-Content-Type-Options        nosniff always;
