# NAV-008 ops VM (different provider from the staging host): Uptime Kuma (MIT) for external monitoring, and a
# push-only Caddy in front of it (deployment-staging.md §9 and §17.4). Owner: backend-engineer.
# Setup: infra/staging/RUNBOOK.md section 10.
#   cp .env.example .env && chmod 600 .env && nano .env          # OPS_HOST, ACME_EMAIL (in this directory)
#   docker compose -f /opt/nav-ops/compose.yaml up -d --wait
# Uptime Kuma's UI binds to 127.0.0.1 only; reach it with an SSH tunnel: ssh -L 3001:127.0.0.1:3001 nav-ops@<ops-host>
# Caddy publishes 80/443 (TCP) and forwards ONLY /api/push/* to Uptime Kuma; every other path is 404.
name: navops
services:
  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE:-louislam/uptime-kuma:2.5.5-slim@sha256:9c56a772a7df53f444a404c579e87a27bd0c201375d00d6745a75bf8138f4342}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma:/app/data
    environment:
      TZ: UTC
      # Embedded SQLite; skips Kuma 2.x's first-run database wizard (the UI then asks only for the admin account).
      UPTIME_KUMA_DB_TYPE: sqlite
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b}
    ports:
      # No host IP prefix: published on IPv4 and IPv6. Keys exist only for local tests; keep 80/443 on the VM.
      - "${OPS_HTTP_PORT:-80}:80/tcp"
      - "${OPS_HTTPS_PORT:-443}:443/tcp"
    environment:
      OPS_HOST: ${OPS_HOST:?set OPS_HOST in infra/staging/monitoring/ops-vm/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in infra/staging/monitoring/ops-vm/.env}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - { type: bind, source: ./Caddyfile, target: /etc/caddy/Caddyfile, read_only: true }
      - { type: volume, source: caddy_data, target: /data }
      - { type: volume, source: caddy_config, target: /config }
    # Not gated on Kuma's health: while Kuma starts, pushes get Caddy's 502 and the heartbeat helper retries.
    depends_on:
      - uptime-kuma
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

volumes:
  uptime-kuma: {}
  caddy_data: {}
  caddy_config: {}
