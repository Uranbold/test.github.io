# SEC-2 CI stub for Valhalla /route (infra/ci/backend-static-checks.sh, section "SEC-2"). Runs in the pinned gateway
# image (njs bundled), so the check needs no extra image. Never used outside CI / local checks. See stub.js.
worker_processes 1;
pid /tmp/nginx.pid;
load_module modules/ngx_http_js_module.so;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    client_body_buffer_size 64k;
    client_body_in_single_buffer on;
    js_path /stub;
    js_import stub from stub.js;
    server {
        listen 8002;
        location = /route  { js_content stub.route; }
        location = /status { default_type application/json; return 200 '{"version":"stub"}'; }
    }
}
