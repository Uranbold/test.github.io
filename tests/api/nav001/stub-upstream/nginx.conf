# QA stub of Valhalla /route for NAV-001 SEC-2 AC 48/49 (owner: qa-engineer). Runs in the pinned gateway image (njs
# bundled), started by tests/api/nav001/sec2-harness.sh. Independent of backend/infra test doubles on purpose.
worker_processes 1;
pid /tmp/nginx.pid;
load_module modules/ngx_http_js_module.so;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    access_log off;
    client_body_buffer_size 64k;
    client_body_in_single_buffer on;
    js_path /stub;
    js_import stub from stub.js;
    server {
        listen 8002;
        # default_type "": nginx would otherwise add "Content-Type: text/plain" to the 504 replay; Valhalla sends none.
        location = /route  { default_type ""; js_content stub.route; }
        location = /status { default_type application/json; return 200 '{"version":"qa-stub"}'; }
    }
}
