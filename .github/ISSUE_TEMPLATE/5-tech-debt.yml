name: 🧹 Tech debt
description: Internal improvement with no direct user-visible change (refactor, upgrade, automation).
title: "[Tech debt] "
labels: ["type:tech-debt", "status:new"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should be improved?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk or cost if we don't do it
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options: [routing, search, tiles, gateway, android, ios, web, design, data-osm, ci/infra]
