name: 🐞 Алдаа мэдээлэх · Bug report
description: Апп гацсан, буруу ажилласан эсвэл буруу чиглэл зааж байна. · Something crashes, works wrong, or gives wrong guidance.
title: "[Алдаа] "
labels: ["type:bug", "status:new"]
body:
  - type: markdown
    attributes:
      value: |
        Мэдээлсэнд баярлалаа! Шалгасны дараа алдааны ноцтой байдал болон дараагийн алхмыг хариулна.
        **Гудамжны нэр буруу, зам байхгүй, нэг чиглэлийн зам буруу байна уу?** Энэ нь OpenStreetMap-ийн өгөгдлийн алдаа байж магадгүй. Гэсэн ч энд мэдээлээрэй, бид зөв газар нь чиглүүлнэ.

        *Thanks for reporting! Triage will reply with severity and next steps. Wrong street name or missing road? It may be OpenStreetMap data. Report it here anyway.*

        **Таны бичсэн бүх зүйл нийтэд нээлттэй.** Хэн ч уншиж болох бөгөөд засварласан ч түүхэнд үлдэнэ. Гэр, ажлын болон бусад хувийн байршил, өөрийн GPX файл, таны байршил, утасны дугаар, и-мэйл, нэр харагдах лог, дэлгэцийн зургийг бүү оруулаарай. Аюулгүй байдлын асуудлыг энд бүү мэдээлээрэй, SECURITY.md-г үзнэ үү.

        *Everything you write here is public. Anyone can read it, and it stays in the history even after editing. Do not post your home, work or other private locations, your own GPX recordings, or logs and screenshots that show your position, phone number, email or names. Do not report security problems here; see SECURITY.md.*
  - type: textarea
    id: what
    attributes:
      label: Юу болсон бэ? · What happened?
      description: Бодитоор юу болсныг бичнэ үү. Алдааны мэдэгдэл байвал хуулж оруулна уу. · Actual behaviour, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Юу болно гэж хүлээж байсан бэ? · What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Давтан гаргах алхмууд · Steps to reproduce
      placeholder: |
        1. Аппыг нээж "Сүхбаатарын талбай" гэж хайна
        2. «Маршрут гаргах» дараад «Эхлэх» дарна
        3. ...
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Байршил / маршрут · Location / route
      description: Нийтэд харагдана. Ойролцоох нийтийн газар, уулзвар эсвэл 3 оронтой бутархай хүртэл тоймлосон координат (ойролцоогоор 100 м) бичнэ үү. Гэр, ажлын хаягаа бүү бичээрэй. · Public. Use a nearby public place or intersection, or round coordinates to 3 decimals (about 100 m). Never your home or work address.
      placeholder: "47.919, 106.918 → 47.647, 106.820"
  - type: dropdown
    id: platform
    attributes:
      label: Платформ · Platform
      multiple: true
      options: ["Android", "iOS", "Вэб · Web", "Backend / API", "Мэдэхгүй · Not sure"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Аппын хувилбар / build / commit · App version / build / commit
  - type: dropdown
    id: impact
    attributes:
      label: Танд хэр их нөлөөлж байна вэ? (Эцсийн ноцтой байдлыг шалгагч тогтооно) · How bad is it for you? (triage sets the final severity)
      options:
        - "Үйлчилгээ ажиллахгүй, апп унтарсан эсвэл аюултай чиглэл заасан · Service down, crash, or dangerous guidance"
        - "Үндсэн функц ажиллахгүй, өөр арга байхгүй · Core feature broken, no workaround"
        - "Муу ажиллаж байгаа ч өөр арга бий · Degraded, workaround exists"
        - "Зөвхөн харагдах байдлын асуудал · Cosmetic"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Дэлгэцийн зураг, бичлэг, GPX зам эсвэл лог · Screenshots, recording, GPX track or logs
      description: Нийтэд харагдана. Эхлээд хувийн мэдээллээ устгана уу. GPX файлыг зөвхөн асуудалтай хэсгээр нь тасалж, гэр, ажлаасаа хол эхлүүлж дуусгана уу; дэлгэцийн зургийг тайрч, логоос координат, утасны дугаар, и-мэйл, нэрийг устгана уу. · Public. Remove personal data first. Cut GPX files to the problem section so they start and end away from your home or work, crop screenshots, and delete coordinates, phone numbers, emails and names from logs.
  - type: input
    id: story
    attributes:
      label: Холбогдох story ID (мэдэж байвал) · Related story ID (if known)
      placeholder: NAV-004
